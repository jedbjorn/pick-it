name: Build

# CI for every PR and push to main. Delegates to the reusable _build.yml so
# release.yml builds exactly the same pipeline: the six Debug/Release
# configurations (Debug R25/R26/R27 upload the PickIt-Debug-R25 / -R26 / -R27
# add-in artifacts), the Windows MSI job (PickIt-msi, PickIt-zips) and its
# detection test (PickIt-detection). Every job is required. Push/PR builds
# carry the dev version (0.0.0-dev; MSI ProductVersion 0.0.0).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/_build.yml
